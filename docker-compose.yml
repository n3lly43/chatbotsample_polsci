# Prerequisites: config.yaml must exist. Run 'python setup.py' first.
services:
  chatbot:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./chroma_db:/app/chroma_db
      - ./sql_db:/app/sql_db
      - ./config.yaml:/app/config.yaml:ro  # Must exist before running
      # API keys: set via environment variables below (preferred)
      # or mount .env file: - ./.env:/app/.env:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
